<style>

*{
margin:0;
padding:0;

}

body{

}

html{

a{

text-transform:uppercase;

}

.nav-links a:hover{

margin:auto;

}

padding:18px 38px;

border-radius:100px;

background:

135deg,
#C9A96E,
#8B6F47
);
